services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geeknosy-backend
    volumes:
      - datagobs-data:/app/data
    environment:
      - GEEKNOSY_DATABASE_URL=sqlite+aiosqlite:////app/data/datagobs.db
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geeknosy-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Mantener el volumen y archivo originales para conservar el historial.
  datagobs-data:
    name: datagobs_datagobs-data
