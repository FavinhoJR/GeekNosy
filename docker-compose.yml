services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datagobs-backend
    volumes:
      - datagobs-data:/app/data
    environment:
      - DATAGOBS_DATABASE_URL=sqlite+aiosqlite:////app/data/datagobs.db
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datagobs-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datagobs-data:
